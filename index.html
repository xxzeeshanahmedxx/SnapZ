<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SnapZ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📸</text></svg>">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ================= CAMERA ================= -->
<section id="cam" class="screen on">
  <video id="video" autoplay playsinline muted></video>
  <div id="flash" class="flash"></div>


  <div id="fallback" class="fallback" hidden>
    <p id="fbMsg"></p>
    <button id="fbRetry" class="pill">Enable camera</button>
    <label class="pill ghost">Use device camera<input id="pick" type="file" accept="image/*" capture="user" hidden></label>
    <a id="fbTab" class="pill ghost" target="_blank" rel="noopener" hidden>Open in a new tab ↗</a>
  </div>

  <div class="bar">
    <button id="toGallery" class="thumb" aria-label="Gallery"></button>
    <button id="shutter" class="shutter" aria-label="Capture"></button>
    <button id="flip" class="flip" aria-label="Flip camera">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 8V6a2 2 0 0 1 2-2h3l1.5-2h5L16 4h3a2 2 0 0 1 2 2v2"/>
        <path d="M21 12v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-6"/>
        <path d="M8 13l-2 2 2 2M16 17l2-2-2-2M6 15h12"/>
      </svg>
    </button>
  </div>
</section>

<!-- ================= GALLERY ================= -->
<section id="gal" class="screen">
  <header class="ghead">
    <button id="toCam" class="icobtn" aria-label="Back to camera">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span id="gcount"></span>
    <div class="ghead-r">
      <button id="playBtn" class="icobtn" aria-label="Time-lapse">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button id="menu" class="icobtn" aria-label="Export">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
      </button>
    </div>
  </header>
  <div id="grid" class="grid"></div>
  <p id="empty" class="empty">No snaps yet</p>
</section>

<!-- ================= VIEWER ================= -->
<section id="viewer" class="screen viewer" hidden>
  <img id="vImg" alt="">
  <div class="vtop">
    <button id="vClose" class="icobtn" aria-label="Close">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <button id="vDel" class="icobtn" aria-label="Delete">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
    </button>
  </div>
  <div class="vmeta">
    <h2 id="vDate"></h2>
    <p id="vTime"></p>
    <p id="vPlace"></p>
    <div class="vlinks">
      <a id="vMap" target="_blank" rel="noopener">Map</a>
      <a id="vOpen" target="_blank" rel="noopener">Open image</a>
      <a id="vDl" download>Download</a>
    </div>
  </div>
</section>

<!-- ================= TIME-LAPSE ================= -->
<section id="lapse" class="screen lapse" hidden>
  <canvas id="lapseCv"></canvas>
  <div id="lapseDate" class="lapse-date"></div>
  <div class="lapse-bar">
    <button id="lClose" class="pill ghost">Close</button>
    <input id="lSpeed" type="range" min="2" max="16" value="6" aria-label="Speed">
    <button id="lSave" class="pill">Save video</button>
  </div>
</section>

<script type="module" src="app.js"></script>
</body>
</html>
