<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SnapZ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📸</text></svg>">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body class="page">
<!-- ================= CAMERA ================= -->
<section id="cam" class="screen on">
  <video id="video" autoplay playsinline muted></video>
  <div id="flash" class="flash"></div>

  <div id="fallback" class="fallback" hidden>
    <p id="fbMsg"></p>
    <button id="fbRetry" class="pill">Enable camera</button>
    <label class="pill ghost">Use device camera<input id="pick" type="file" accept="image/*" capture="user" hidden></label>
    <a id="fbTab" class="pill ghost" target="_blank" rel="noopener" hidden>Open in a new tab ↗</a>
  </div>

  <div class="bar">
    <!-- the thumbnail IS the status object: preview, progress ring, confirmation -->
    <div class="thumb-wrap">
      <button id="toGallery" class="thumb" aria-label="Gallery"></button>
      <svg id="ring" class="ring" viewBox="0 0 64 64" aria-hidden="true">
        <circle class="ring-bg" cx="32" cy="32" r="29"/>
        <circle id="ringFg" class="ring-fg" cx="32" cy="32" r="29"/>
      </svg>
      <svg id="ringTick" class="ring-tick" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M20 33.5l8.5 8.5L45 24"/>
      </svg>
    </div>

    <button id="shutter" class="shutter" aria-label="Capture"><span></span></button>

    <button id="flip" class="flip" aria-label="Flip camera">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 8V6a2 2 0 0 1 2-2h3l1.5-2h5L16 4h3a2 2 0 0 1 2 2v2"/>
        <path d="M21 12v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-6"/>
        <path d="M8 13l-2 2 2 2M16 17l2-2-2-2M6 15h12"/>
      </svg>
    </button>
  </div>

  <!-- the captured frame flies into the thumbnail from here -->
  <div id="flight" class="flight" hidden></div>
</section>

<!-- ================= SETTINGS =================
     Long-press the thumbnail. No prompts, no typed commands. -->
<div id="sheetWrap" class="sheet-wrap" hidden>
  <div id="sheetBg" class="sheet-bg"></div>
  <section id="sheet" class="sheet" role="dialog" aria-label="Settings">
    <div class="grab"></div>
    <h2>Settings</h2>

    <p class="grouphead">Viewing window</p>
    <div class="group">
      <div class="row">
        <label for="sFrom" class="rowlabel">Photos open</label>
        <div class="times">
          <input id="sFrom" type="time" step="300" value="18:00">
          <span>to</span>
          <input id="sTo" type="time" step="300" value="21:00">
        </div>
      </div>
      <div class="row">
        <label for="sLift" class="rowlabel">Lift the lock <span class="tag">testing</span></label>
        <label class="sw"><input id="sLift" type="checkbox"><span class="sw-track"><span class="sw-knob"></span></span></label>
      </div>
    </div>
    <p class="groupfoot">Enforced by the server, not just this phone. Taking photos is never blocked.</p>

    <p class="grouphead">Account</p>
    <div class="group">
      <button id="sPass" class="row tap">Change passcode
        <svg class="chev" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
             stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <div id="passForm" class="subform" hidden>
        <input id="pCur" type="password" autocomplete="current-password" placeholder="Current passcode">
        <input id="pNew" type="password" autocomplete="new-password" placeholder="New passcode">
        <button id="pGo" class="pill">Save passcode</button>
      </div>
      <button id="sApi" class="row tap">API endpoint
        <svg class="chev" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
             stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <div id="apiForm" class="subform" hidden>
        <input id="aUrl" type="url" inputmode="url" placeholder="https://…">
        <button id="aGo" class="pill">Save endpoint</button>
      </div>
      <button id="sOut" class="row tap danger">Sign out</button>
    </div>

    <p id="sMsg" class="sheet-msg" hidden></p>
    <button id="sClose" class="pill done">Done</button>
  </section>
</div>

<!-- ================= LOGIN ================= -->
<script type="module" src="/camera.js"></script>
</body>
</html>
