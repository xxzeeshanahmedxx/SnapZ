<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SnapZ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📸</text></svg>">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body class="page">
<!-- ================= CAMERA ================= -->
<section id="cam" class="screen on">
  <video id="video" autoplay playsinline muted></video>
  <div id="flash" class="flash"></div>

  <div id="fallback" class="fallback" hidden>
    <p id="fbMsg"></p>
    <button id="fbRetry" class="pill">Enable camera</button>
    <label class="pill ghost">Use device camera<input id="pick" type="file" accept="image/*" capture="user" hidden></label>
    <a id="fbTab" class="pill ghost" target="_blank" rel="noopener" hidden>Open in a new tab ↗</a>
  </div>

  <div class="bar">
    <!-- the thumbnail IS the status object: preview, progress ring, confirmation -->
    <div class="thumb-wrap">
      <button id="toGallery" class="thumb" aria-label="Gallery"></button>
      <svg id="ring" class="ring" viewBox="0 0 64 64" aria-hidden="true">
        <circle class="ring-bg" cx="32" cy="32" r="29"/>
        <circle id="ringFg" class="ring-fg" cx="32" cy="32" r="29"/>
      </svg>
      <svg id="ringTick" class="ring-tick" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M20 33.5l8.5 8.5L45 24"/>
      </svg>
    </div>

    <button id="shutter" class="shutter" aria-label="Capture"><span></span></button>

    <button id="flip" class="flip" aria-label="Flip camera">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 8V6a2 2 0 0 1 2-2h3l1.5-2h5L16 4h3a2 2 0 0 1 2 2v2"/>
        <path d="M21 12v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-6"/>
        <path d="M8 13l-2 2 2 2M16 17l2-2-2-2M6 15h12"/>
      </svg>
    </button>
  </div>

  <!-- the captured frame flies into the thumbnail from here -->
  <div id="flight" class="flight" hidden></div>
</section>

<!-- ================= LOGIN ================= -->
<section id="login" class="screen lock" hidden>
  <div class="lock-box">
    <div class="lock-logo"></div>
    <h1 id="lockTitle">Enter passcode</h1>
    <p id="lockSub">Unlock cloud backup on this device</p>
    <input id="lockPass" type="password" inputmode="text" autocomplete="current-password"
           placeholder="Passcode" enterkeyhint="go">
    <p id="lockErr" class="lock-err" hidden></p>
    <button id="lockGo" class="pill wide">Continue</button>
    <button id="lockSkip" class="linkish">Use this device without backup</button>
  </div>
</section>

<!-- ================= GALLERY ================= -->
<section id="gal" class="screen">
  <header class="ghead">
    <button id="toCam" class="icobtn" aria-label="Back to camera">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span id="gcount"></span>
    <div class="ghead-r">
      <button id="playBtn" class="icobtn" aria-label="Time-lapse">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button id="menu" class="icobtn" aria-label="Export">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
      </button>
    </div>
  </header>

  <!-- honest state of the archive, never a statistic -->
  <p id="ledger" class="ledger" hidden></p>
  <p id="closing" class="closing" hidden></p>
  <div id="alert" class="alert" hidden></div>

  <div id="grid" class="grid"></div>
  <p id="empty" class="empty" hidden>No snaps yet</p>
</section>
<script type="module" src="/camera.js"></script>
</body>
</html>
