<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SnapZ · Lock</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📸</text></svg>">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body class="page">
<!-- ================= LOGIN ================= -->
<section id="login" class="screen lock on">
  <div class="lock-box">
    <div class="lock-logo"></div>
    <h1 id="lockTitle">Enter passcode</h1>
    <p id="lockSub">Unlock cloud backup on this device</p>
    <input id="lockPass" type="password" inputmode="text" autocomplete="current-password"
           placeholder="Passcode" enterkeyhint="go">
    <p id="lockErr" class="lock-err" hidden></p>
    <button id="lockGo" class="pill wide">Continue</button>
    <button id="lockSkip" class="linkish">Use this device without backup</button>
  </div>
</section>
<script type="module" src="/login.js"></script>
</body>
</html>
